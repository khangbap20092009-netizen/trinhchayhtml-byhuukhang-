<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Chạy HTML Trực Tiếp - by NGÔ HỮU KHANG (Hybrid)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #007acc 0%, #005f99 100%);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .run-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .run-btn:hover { background-color: #059669; }
        .run-btn:active { transform: scale(0.95); }

        .container {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            height: calc(100vh - 55px);
        }
        @media (min-width: 768px) {
            .container { flex-direction: row; }
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #334155;
        }
        .pane-header {
            background-color: #252526;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cccccc;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-code { background-color: #e34c26; box-shadow: 0 0 5px #e34c26; }
        .dot-preview { background-color: #10b981; box-shadow: 0 0 5px #10b981; }
        
        #status-indicator {
            margin-left: auto;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background-color: #333;
        }

        #editor-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #editor-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }
        
        textarea#fallback-editor {
            flex: 1;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: Consolas, "Courier New", monospace;
            font-size: 15px;
            line-height: 1.6;
            padding: 15px;
            border: none;
            resize: none;
            outline: none;
            tab-size: 4;
            display: none; 
        }
        
        textarea::-webkit-scrollbar { width: 8px; height: 8px; }
        textarea::-webkit-scrollbar-track { background: #1e1e1e; }
        textarea::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #64748b; }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧑‍💻 Trình Soạn Thảo HTML (by NGÔ HỮU KHANG)</h1>
        <button id="run-btn" class="run-btn">▶ RUN</button>
    </div>
    
    <div class="container">
        <div class="pane">
            <div class="pane-header">
                <div class="dot dot-code"></div>
                index.html
                <!-- Hiển thị trạng thái mạng -->
                <span id="status-indicator">Đang kiểm tra...</span>
            </div>
            
            <div id="editor-wrapper">
                <div id="editor-container"></div>
                <!-- Xóa chữ mờ khi offline -->
                <textarea id="fallback-editor" spellcheck="false"></textarea>
            </div>
        </div>

        <div class="pane">
            <div class="pane-header">
                <div class="dot dot-preview"></div>
                Kết Quả
            </div>
            <iframe id="preview-window"></iframe>
        </div>
    </div>

    <script>
        const statusIndicator = document.getElementById('status-indicator');
        const editorContainer = document.getElementById('editor-container');
        const fallbackEditor = document.getElementById('fallback-editor');
        const previewWindow = document.getElementById('preview-window');
        const runBtn = document.getElementById('run-btn');

        let isOnlineMode = false;
        let monacoInstance = null;

        function enableOfflineMode() {
            isOnlineMode = false;
            editorContainer.style.display = 'none';
            fallbackEditor.style.display = 'block';
            statusIndicator.innerHTML = '🔴 Offline';
            statusIndicator.style.color = '#fca5a5';
        }

        function initOnlineMode() {
            const script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js";
            
            script.onload = function() {
                require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
                require(['vs/editor/editor.main'], function() {
                    
                    isOnlineMode = true;
                    statusIndicator.innerHTML = '🟢 Online';
                    statusIndicator.style.color = '#86efac'; 
                    
                    monacoInstance = monaco.editor.create(document.getElementById('editor-container'), {
                        value: fallbackEditor.value,
                        language: 'html',
                        theme: 'vs-dark',
                        automaticLayout: true,
                        minimap: { enabled: false },
                        fontSize: 15,
                        fontFamily: "Consolas, 'Courier New', monospace",
                        wordWrap: 'on',
                        formatOnPaste: true,
                        suggestOnTriggerCharacters: true
                    });
                });
            };
            
            script.onerror = function() {
                enableOfflineMode();
            };
            
            document.body.appendChild(script);
        }

        if (navigator.onLine) {
            initOnlineMode();
        } else {
            enableOfflineMode();
        }

        function updatePreview() {
            let code = "";
            
            if (isOnlineMode && monacoInstance) {
                code = monacoInstance.getValue();
            } else {
                code = fallbackEditor.value;
            }

            const iframeDoc = previewWindow.contentDocument || previewWindow.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(code);
            iframeDoc.close();
        }

        runBtn.addEventListener('click', updatePreview);

        fallbackEditor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
            if (e.ctrlKey && e.key === 'Enter') {
                updatePreview();
            }
        });

        window.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                updatePreview();
            }
        });

        updatePreview(); 
    </script>
</body>
</html>
